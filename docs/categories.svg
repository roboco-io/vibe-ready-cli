  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="2">ANALYSIS CATEGORIES</text>

  <!-- Must-Have Section -->
  <text x="40" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171" letter-spacing="1.5">MUST-HAVE</text>
  <text x="155" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">60% of total weight</text>
  <line x1="40" y1="90" x2="860" y2="90" stroke="#ef4444" stroke-width="0.5" opacity="0.3"/>

  <!-- Test Coverage -->
  <g filter="url(#s2)">
    <rect x="40" y="105" width="260" height="145" rx="10" fill="#ef4444" opacity="0.08"/>
    <rect x="40" y="105" width="260" height="145" rx="10" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <!-- Weight badge -->
