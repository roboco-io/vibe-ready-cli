    <rect x="320" y="315" width="260" height="145" rx="10" fill="#3b82f6" opacity="0.08"/>
    <rect x="320" y="315" width="260" height="145" rx="10" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <rect x="508" y="325" width="60" height="20" rx="10" fill="#3b82f6" opacity="0.25"/>
    <text x="538" y="339" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">13.3%</text>
