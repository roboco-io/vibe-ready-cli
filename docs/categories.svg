    <text x="360" y="416" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">API docs (JSDoc, OpenAPI)</text>
    <circle cx="348" cy="432" r="3" fill="#475569"/>
    <text x="360" y="436" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Architecture docs (ADR)</text>
  </g>

