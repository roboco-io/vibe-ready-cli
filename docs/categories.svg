    <text x="264" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171">20%</text>
    <!-- Content -->
    <text x="60" y="132" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Test Coverage</text>
    <line x1="60" y1="143" x2="280" y2="143" stroke="#334155" stroke-width="0.5"/>
    <circle cx="68" cy="162" r="3" fill="#475569"/>
    <text x="80" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Test frameworks &amp; config</text>
    <circle cx="68" cy="182" r="3" fill="#475569"/>
    <text x="80" y="186" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Test files &amp; coverage setup</text>
    <circle cx="68" cy="202" r="3" fill="#475569"/>
    <text x="80" y="206" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Test scripts in build config</text>
    <circle cx="68" cy="222" r="3" fill="#475569"/>
    <text x="80" y="226" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Coverage thresholds</text>
  </g>

