    <rect x="320" y="105" width="260" height="145" rx="10" fill="#ef4444" opacity="0.08"/>
    <rect x="320" y="105" width="260" height="145" rx="10" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <rect x="520" y="115" width="48" height="20" rx="10" fill="#ef4444" opacity="0.25"/>
