  <g filter="url(#s2)">
    <rect x="600" y="315" width="260" height="145" rx="10" fill="#3b82f6" opacity="0.08"/>
    <rect x="600" y="315" width="260" height="145" rx="10" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <rect x="788" y="325" width="60" height="20" rx="10" fill="#3b82f6" opacity="0.25"/>
    <text x="818" y="339" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">13.4%</text>
    <text x="620" y="342" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">Harness Engineering</text>
    <line x1="620" y1="353" x2="840" y2="353" stroke="#334155" stroke-width="0.5"/>
    <circle cx="628" cy="372" r="3" fill="#475569"/>
    <text x="640" y="376" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">CLAUDE.md, AGENTS.md</text>
    <circle cx="628" cy="392" r="3" fill="#475569"/>
    <text x="640" y="396" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">.claude/settings.json</text>
    <circle cx="628" cy="412" r="3" fill="#475569"/>
    <text x="640" y="416" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Agent skills &amp; commands</text>
    <circle cx="628" cy="432" r="3" fill="#475569"/>
    <text x="640" y="436" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Multi-AI tool support</text>
  </g>

  <!-- Penalty notice -->
  <rect x="280" y="268" width="340" height="22" rx="6" fill="#fbbf24" opacity="0.1"/>
  <rect x="280" y="268" width="340" height="22" rx="6" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.4"/>
  <text x="300" y="283" font-family="system-ui, sans-serif" font-size="10" fill="#fbbf24">&#9888;</text>
  <text x="316" y="283" font-family="system-ui, sans-serif" font-size="9" fill="#fbbf24">Any Must-Have category with F grade caps overall grade at C</text>
</svg>
