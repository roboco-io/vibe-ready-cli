<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cli" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="analyzer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scorer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="reporter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="2">DATA FLOW ARCHITECTURE</text>

  <!-- Pipeline boxes -->
  <!-- CLI Input -->
  <g filter="url(#shadow)">
    <rect x="30" y="90" width="140" height="130" rx="10" fill="url(#cli)" opacity="0.15"/>
    <rect x="30" y="90" width="140" height="130" rx="10" fill="none" stroke="url(#cli)" stroke-width="1.5"/>
    <text x="100" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8">CLI</text>
    <text x="100" y="152" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">index.ts</text>
    <line x1="55" y1="168" x2="145" y2="168" stroke="#334155" stroke-width="0.5"/>
    <text x="100" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">commander</text>
    <text x="100" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">args parsing</text>
  </g>

  <!-- Arrow 1 -->
  <g filter="url(#glow)">
    <line x1="175" y1="155" x2="215" y2="155" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <polygon points="215,149 227,155 215,161" fill="#6366f1"/>
  </g>

  <!-- Analyzer -->
  <g filter="url(#shadow)">
    <rect x="230" y="70" width="180" height="170" rx="10" fill="url(#analyzer)" opacity="0.15"/>
    <rect x="230" y="70" width="180" height="170" rx="10" fill="none" stroke="url(#analyzer)" stroke-width="1.5"/>
    <text x="320" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a78bfa">Analyzer</text>
    <text x="320" y="132" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">analyzer.ts</text>
    <line x1="255" y1="148" x2="385" y2="148" stroke="#334155" stroke-width="0.5"/>
    <text x="320" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Claude Agent SDK</text>
    <text x="320" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">query() with</text>
    <text x="320" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Read, Glob, Grep</text>
    <!-- SDK badge -->
    <rect x="270" y="210" width="100" height="20" rx="10" fill="#8b5cf6" opacity="0.3"/>
    <text x="320" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#c4b5fd">LLM-powered</text>
  </g>

  <!-- Arrow 2 -->
  <g filter="url(#glow)">
    <line x1="415" y1="155" x2="455" y2="155" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    <polygon points="455,149 467,155 455,161" fill="#8b5cf6"/>
  </g>

  <!-- Scorer -->
  <g filter="url(#shadow)">
    <rect x="470" y="90" width="160" height="130" rx="10" fill="url(#scorer)" opacity="0.15"/>
    <rect x="470" y="90" width="160" height="130" rx="10" fill="none" stroke="url(#scorer)" stroke-width="1.5"/>
    <text x="550" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6">Scorer</text>
    <text x="550" y="152" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">scorer.ts</text>
    <line x1="495" y1="168" x2="605" y2="168" stroke="#334155" stroke-width="0.5"/>
    <text x="550" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">weighted average</text>
    <text x="550" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">grade + penalty</text>
  </g>

  <!-- Arrow 3 -->
  <g filter="url(#glow)">
    <line x1="635" y1="155" x2="675" y2="155" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <polygon points="675,149 687,155 675,161" fill="#ec4899"/>
  </g>

  <!-- Reporter -->
  <g filter="url(#shadow)">
    <rect x="690" y="90" width="180" height="130" rx="10" fill="url(#reporter)" opacity="0.15"/>
    <rect x="690" y="90" width="180" height="130" rx="10" fill="none" stroke="url(#reporter)" stroke-width="1.5"/>
    <text x="780" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Reporter</text>
    <text x="780" y="152" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">reporter.ts</text>
    <line x1="715" y1="168" x2="845" y2="168" stroke="#334155" stroke-width="0.5"/>
    <text x="780" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">chalk formatting</text>
    <text x="780" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">terminal / markdown</text>
  </g>

  <!-- Data labels on arrows -->
  <text x="200" y="140" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">path, opts</text>
  <text x="440" y="140" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">LLMAnalysisOutput</text>
  <text x="660" y="140" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">AnalysisResult</text>

  <!-- Bottom: Prompt -->
  <g>
    <rect x="265" y="258" width="110" height="28" rx="6" fill="#7c3aed" opacity="0.15"/>
    <rect x="265" y="258" width="110" height="28" rx="6" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="320" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#7c3aed">prompts/analyze.ts</text>
  </g>
  <line x1="320" y1="258" x2="320" y2="245" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="316,245 320,238 324,245" fill="#7c3aed" opacity="0.7"/>

  <!-- Bottom: Types -->
  <g>
    <rect x="490" y="258" width="120" height="28" rx="6" fill="#be185d" opacity="0.15"/>
    <rect x="490" y="258" width="120" height="28" rx="6" fill="none" stroke="#be185d" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="550" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#be185d">types.ts</text>
  </g>
  <line x1="550" y1="258" x2="550" y2="225" stroke="#be185d" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="546,225 550,218 554,225" fill="#be185d" opacity="0.7"/>

  <!-- Bottom: Config -->
  <g>
    <rect x="710" y="258" width="140" height="28" rx="6" fill="#d97706" opacity="0.15"/>
    <rect x="710" y="258" width="140" height="28" rx="6" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="780" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97706">.vibeready.json</text>
  </g>
  <line x1="780" y1="258" x2="780" y2="225" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="776,225 780,218 784,225" fill="#d97706" opacity="0.7"/>
</svg>
